<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>灵境智游 · 启动页</title>
    <meta http-equiv="refresh" content="0; url=./docs/index.html" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
        background: radial-gradient(circle at 50% 30%, #12352a 0%, #0a1712 60%, #060d0a 100%);
        color: #e8f3ec;
      }
      .card {
        width: min(680px, 92vw);
        padding: 40px 36px;
        border: 1px solid rgba(200, 230, 214, 0.18);
        border-radius: 18px;
        background: rgba(12, 31, 25, 0.72);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        text-align: center;
      }
      h1 { margin: 0 0 6px; font-size: 30px; letter-spacing: 2px; }
      .sub { margin: 0 0 26px; color: #9fc0b0; font-size: 14px; letter-spacing: 1px; }
      .btn {
        display: inline-block;
        padding: 14px 38px;
        border-radius: 999px;
        font-size: 17px;
        text-decoration: none;
        color: #07211a;
        background: linear-gradient(135deg, #9fe3c4, #63c39c);
        font-weight: 700;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(99, 195, 156, 0.35); }
      .tip { margin-top: 24px; font-size: 13px; line-height: 1.9; color: #93b3a4; }
      .tip code { background: rgba(255, 255, 255, 0.08); padding: 2px 6px; border-radius: 4px; }
      .bar { margin: 26px auto 0; width: 220px; height: 3px; border-radius: 3px; background: rgba(255,255,255,0.1); overflow: hidden; }
      .bar i { display: block; height: 100%; width: 40%; background: #63c39c; animation: move 1.1s infinite ease-in-out; }
      @keyframes move { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>灵境智游 · 灵山胜境</h1>
      <p class="sub">AI 数字人导览平台 · 网页启动页</p>
      <a class="btn" href="./docs/index.html">立即进入演示</a>
      <div class="bar"><i></i></div>
      <p class="tip">
        正在自动跳转…如未跳转请点击上方按钮。<br />
        GitHub Pages 地址：<code>https://&lt;用户名&gt;.github.io/&lt;仓库名&gt;/docs/</code><br />
        本地启动：双击仓库根目录的 <code>启动本地网页.bat</code>
      </p>
    </div>
    <script>
      // 兜底跳转（meta refresh 被浏览器拦截时仍然生效）
      setTimeout(function () {
        if (!/docs\/(index\.html)?$/.test(location.pathname)) {
          location.replace("./docs/index.html");
        }
      }, 300);
    </script>
  </body>
</html>
